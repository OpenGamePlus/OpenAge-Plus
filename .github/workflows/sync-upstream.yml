name: sync-upstream
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'OpenGamePlus/OpenAge-Plus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN may not push upstream commits that change workflow files
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Fetch upstream
        run: git fetch https://github.com/SFTtech/openage.git master:refs/remotes/upstream/master
      - name: Open sync pull request
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if git merge-base --is-ancestor upstream/master origin/master; then
            echo "master already contains upstream/master"
            exit 0
          fi
          git push --force origin upstream/master:refs/heads/sync/upstream
          if [ -z "$(gh pr list --head sync/upstream --state open --json number --jq '.[].number')" ]; then
            gh pr create --base master --head sync/upstream \
              --title "sync: merge SFTtech/openage master" \
              --body "Automated sync with upstream SFTtech/openage master."
          fi
